<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects — Kendra Lockard</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="theme-light">
    <div class="scanlines"></div>

    <div class="ui">
      <header class="nav">
        <a href="/" class="brand">Kendra Lockard</a>
        <ul class="nav-links">
          <li><a href="/work">Work</a></li>
          <li><a href="/projects">Projects</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </header>

      <div class="reveal-panel active" id="panel-projects">
        <div class="site-carousel" id="site-carousel">
          <div class="site-slides">
            <div class="site-card active">
              <div class="site-frame">
                <iframe
                  src="https://walkwithavalon.com"
                  title="Walk with Avalon"
                  loading="lazy"
                ></iframe>
              </div>
              <a
                class="site-name"
                href="https://walkwithavalon.com"
                target="_blank"
                rel="noopener"
                >Walk with Avalon &#8599;</a
              >
            </div>
            <div class="site-card">
              <div class="site-frame">
                <iframe
                  src="https://noahwoodfragrances.netlify.app"
                  title="Noah Wood Fragrances"
                  loading="lazy"
                ></iframe>
              </div>
              <a
                class="site-name"
                href="https://noahwoodfragrances.netlify.app"
                target="_blank"
                rel="noopener"
                >Noah Wood Fragrances &#8599;</a
              >
            </div>
          </div>
          <div class="site-carousel-controls">
            <button
              type="button"
              class="site-carousel-btn"
              id="site-prev"
              aria-label="Previous site"
            >
              &#8592;
            </button>
            <div class="site-carousel-dots">
              <button
                type="button"
                class="site-dot active"
                data-index="0"
                aria-label="Show Walk with Avalon"
              ></button>
              <button
                type="button"
                class="site-dot"
                data-index="1"
                aria-label="Show Noah Wood Fragrances"
              ></button>
            </div>
            <button
              type="button"
              class="site-carousel-btn"
              id="site-next"
              aria-label="Next site"
            >
              &#8594;
            </button>
          </div>
        </div>
      </div>

      <div class="status-group">
        <div class="status-dot"></div>
        <span>ONLINE</span>
        <span id="coords">X:+0.000 &middot; Y:+0.000</span>
      </div>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/carousel.js"></script>
  </body>
</html>
